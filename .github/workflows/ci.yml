name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcanum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arcanum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.6'
          elixir-version: '1.20.4'
          version-type: strict

      - name: Cache dependencies and compiled code
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test/lib
            _build/dev/lib
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Cache Dialyzer type information
        uses: actions/cache@v5
        with:
          path: |
            ~/.mix/*.plt*
            _build/test/*.plt*
          key: plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run tests and database migrations
        run: mix test

      - name: Build frontend assets
        run: mix assets.build
        env:
          MIX_ENV: dev
